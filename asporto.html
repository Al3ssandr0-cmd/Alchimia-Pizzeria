<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alchimia Pizzeria - Ordine Asporto e Domicilio</title>
    
    <!-- Stripe JS SDK (Necessario per gestire i pagamenti con carta) -->
    <script src="https://js.stripe.com/v3/"></script>
    <script src="/socket.io/socket.io.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f8f9fa;
        }
        h1, h2, h3 { color: #333; }
        .section {
            background: #fff;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"], input[type="tel"], select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .radio-option {
            margin-bottom: 8px;
            font-weight: normal;
            cursor: pointer;
        }
        #stripe-container {
            border: 1px solid #007bff;
            padding: 15px;
            border-radius: 6px;
            background-color: #f0f7ff;
            margin-top: 15px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background-color: #218838; }
        #card-errors {
            color: #d9534f;
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>🍕 Alchimia Pizzeria</h1>

    <!-- 1. DATI CLIENTE -->
    <div class="section">
        <h2>Dati Cliente</h2>
        <div class="form-group">
            <label for="nome">Nome e Cognome</label>
            <input type="text" id="nome" placeholder="Es. Mario Rossi" required>
        </div>
        <div class="form-group">
            <label for="telefono">Telefono</label>
            <input type="tel" id="telefono" placeholder="Es. 333 1234567" required>
        </div>
    </div>

    <!-- 2. SCELTA TIPO ORDINE -->
    <div class="section">
        <h2>Modalità di Consegna</h2>
        <label class="radio-option">
            <input type="radio" name="tipo_ordine" value="asporto" checked onchange="gestisciTipoOrdine()">
            🛍️ <strong>Ritiro in Pizzeria (Asporto)</strong> - Paga in cassa al ritiro
        </label>
        <br>
        <label class="radio-option">
            <input type="radio" name="tipo_ordine" value="domicilio" onchange="gestisciTipoOrdine()">
            🛵 <strong>Consegna a Domicilio</strong> - Pagamento online obbligatorio
        </label>

        <!-- Campo Indirizzo (Inizialmente nascosto) -->
        <div id="campo-indirizzo" class="form-group" style="display: none; margin-top: 15px;">
            <label for="indirizzo">Indirizzo di Consegna</label>
            <input type="text" id="indirizzo" placeholder="Via, Civico, Città">
        </div>
    </div>

    <!-- 3. CARRELLO / TOTALE -->
    <div class="section">
        <h2>Totale Ordine</h2>
        <p>Totale da pagare: <strong id="totale-mostrato">18.50 €</strong></p>
    </div>

    <!-- 4. MODULO STRIPE CARTA DI CREDITO (Visibile solo per Domicilio) -->
    <div id="stripe-container" style="display: none;" class="section">
        <h3>💳 Pagamento Sicuro con Carta</h3>
        <p style="font-size: 0.9em; color: #555;">Inserisci i dati della carta per completare l'ordine a domicilio.</p>
        <div id="payment-element">
            <!-- Stripe caricherà qui i campi della carta -->
        </div>
        <div id="card-errors"></div>
    </div>

    <!-- 5. PULSANTE DI CONFERMA -->
    <div class="section">
        <button id="btn-conferma" onclick="confermaEInviaOrdine(event)">Invia Ordine</button>
    </div>

    <script>
        const socket = io();

        // CHIAVE PUBBLICA DI TEST DI STRIPE
        // Quando Alchimia vi darà la sua chiave reale, sostituirete 'pk_test_...' con la sua pk_live_...
        const stripe = Stripe('pk_test_51PxTESTKEY_SOSTITUISCI_CON_LA_TUA_PUBBLICA');
        let elements;
        let paymentElement;

        // Esempio importo totale carrello (in euro)
        const totaleEuro = 18.50; 

        // Gestisce la visibilità in base a cosa sceglie il cliente
        function gestisciTipoOrdine() {
            const tipoOrdine = document.querySelector('input[name="tipo_ordine"]:checked').value;
            const stripeContainer = document.getElementById('stripe-container');
            const campoIndirizzo = document.getElementById('campo-indirizzo');

            if (tipoOrdine === 'domicilio') {
                campoIndirizzo.style.display = 'block';
                stripeContainer.style.display = 'block';
                inizializzaStripe(); // Prepara il form di Stripe per la carta
            } else {
                campoIndirizzo.style.display = 'none';
                stripeContainer.style.display = 'none'; // Nasconde completamente la carta per l'asporto
            }
        }

        // Inizializza il modulo di pagamento Stripe
        async function inizializzaStripe() {
            if (elements) return; // Evita di reinizializzare se già creato

            try {
                const response = await fetch('/create-payment-intent', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ amount: totaleEuro })
                });
                
                const data = await response.json();

                if (data.error) {
                    document.getElementById('card-errors').textContent = data.error;
                    return;
                }

                elements = stripe.elements({ clientSecret: data.clientSecret });
                paymentElement = elements.create('payment');
                paymentElement.mount('#payment-element');
            } catch (err) {
                console.error("Errore durante il caricamento di Stripe:", err);
                document.getElementById('card-errors').textContent = "Impossibile caricare il modulo di pagamento.";
            }
        }

        // Funzione principale di invio dell'ordine
        async function confermaEInviaOrdine(event) {
            if (event) event.preventDefault();

            const nome = document.getElementById('nome').value.trim();
            const telefono = document.getElementById('telefono').value.trim();
            const tipoOrdine = document.querySelector('input[name="tipo_ordine"]:checked').value;
            const indirizzo = document.getElementById('indirizzo').value.trim();

            if (!nome || !telefono) {
                alert("Per favore, inserisci nome e telefono.");
                return;
            }

            const btn = document.getElementById('btn-conferma');
            btn.disabled = true;
            btn.textContent = "Elaborazione in corso...";

            // --- CASO 1: ASPORTO (Paga di persona in cassa) ---
            if (tipoOrdine === 'asporto') {
                inviaOrdineSocket({
                    nome,
                    telefono,
                    tipoOrdine: '🛍️ Asporto',
                    indirizzo: 'Ritiro in Pizzeria',
                    totale: totaleEuro,
                    statoPagamento: '🔴 DA PAGARE IN CASSA'
                });
                return;
            }

            // --- CASO 2: DOMICILIO (Paga online con carta) ---
            if (!indirizzo) {
                alert("Per favore, inserisci l'indirizzo di consegna.");
                btn.disabled = false;
                btn.textContent = "Invia Ordine";
                return;
            }

            // Elabora il pagamento con carta di credito
            const { error, paymentIntent } = await stripe.confirmPayment({
                elements,
                confirmParams: { return_url: window.location.href },
                redirect: 'if_required'
            });

            if (error) {
                document.getElementById('card-errors').textContent = error.message;
                btn.disabled = false;
                btn.textContent = "Invia Ordine";
                return;
            }

            // Se il pagamento è andato a buon fine
            if (paymentIntent && paymentIntent.status === 'succeeded') {
                inviaOrdineSocket({
                    nome,
                    telefono,
                    tipoOrdine: '🛵 Domicilio',
                    indirizzo: indirizzo,
                    totale: totaleEuro,
                    statoPagamento: '🟢 GIÀ PAGATO ONLINE (Carta)'
                });
            }
        }

        // Invio finale dell'ordine alla cucina tramite Socket.io
        function inviaOrdineSocket(datiOrdine) {
            socket.emit('nuovo-ordine', datiOrdine);
            alert("✅ Ordine inviato con successo!");
            window.location.reload(); // Ricarica la pagina per resettare il carrello
        }
    </script>
</body>
</html>
