<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1f130f">
  <title>Pizzeria Alchimia - Ordini Asporto & Domicilio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Fraunces:ital,opsz,wght@1,9..144,500;1,9..144,600&display=swap" rel="stylesheet">
  <!-- Stripe Script ufficiale -->
  <script src="https://js.stripe.com/v3/"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    /* ================= COLORI DEL LOGO ================= */
    :root {
      --bg: #1f130f;            /* marrone espresso del logo */
      --bg-2: #2a1a14;
      --surface: #2f1e17;
      --surface-2: #3a261d;
      --line: rgba(236, 138, 60, .16);
      --line-strong: rgba(236, 138, 60, .45);
      --orange: #ec8a3c;        /* arancio del logo */
      --orange-2: #f7a659;
      --orange-dark: #b8601f;
      --cream: #f4ebdf;          /* crema della scritta ALCHIMIA */
      --muted: #bfa797;
      --basil: #4caf50;
      --danger: #ff7b6b;
      --radius: 18px;
      --shadow: 0 10px 30px rgba(0, 0, 0, .35);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; scroll-padding-top: 76px; }
    body {
      font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--cream);
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      padding-bottom: 96px;
    }
    body::before {
      content: ""; position: fixed; inset: 0; z-index: -2; pointer-events: none;
      background:
        radial-gradient(ellipse 80% 50% at 50% -5%, rgba(236, 138, 60, .22), transparent 60%),
        radial-gradient(ellipse 60% 40% at 100% 100%, rgba(184, 96, 31, .18), transparent 60%);
    }
    #fx-embers { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
    button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
    .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }

    /* ================= LOGO ================= */
    header { text-align: center; padding: 34px 0 6px; }
    .logo { display: inline-flex; flex-direction: column; align-items: center; user-select: none; }
    .logo-top { color: var(--orange); font-weight: 800; font-size: clamp(1.25rem, 4.5vw, 1.7rem); letter-spacing: .02em; margin-bottom: -2px; }
    .logo-main { display: flex; align-items: flex-start; gap: 4px; }
    .logo-tri { width: clamp(52px, 13vw, 76px); height: auto; margin-top: .12em; margin-right: -2px; overflow: visible; }
    .logo-word { font-weight: 700; font-size: clamp(2.6rem, 11vw, 3.9rem); line-height: 1; color: var(--cream); letter-spacing: .01em; }
    .logo-ver {
      align-self: flex-start; margin-left: 6px; margin-top: -4px;
      width: 2.1em; height: 2.1em; border-radius: 50%; border: 2px solid var(--orange);
      display: grid; place-items: center; font-size: clamp(.62rem, 2vw, .78rem); font-weight: 700; color: var(--orange);
    }
    .logo-sub { color: var(--orange); font-weight: 500; letter-spacing: .2em; font-size: clamp(.72rem, 2.6vw, .95rem); margin-top: 6px; }
    .header-note { color: var(--muted); font-size: .85rem; margin-top: 14px; }
    .header-note b { color: var(--cream); font-weight: 600; }

    /* ================= HERO PIZZA 3D ================= */
    .hero { position: relative; margin: 8px 0 6px; text-align: center; }
    .pizza-stage {
      position: relative; height: clamp(260px, 52vw, 360px); margin: 0 -16px;
      cursor: grab; touch-action: pan-y; -webkit-tap-highlight-color: transparent;
    }
    .pizza-stage:active { cursor: grabbing; }
    .pizza-stage canvas { display: block; width: 100% !important; height: 100% !important; }
    .pizza-glow {
      position: absolute; left: 50%; top: 55%; width: min(520px, 90%); aspect-ratio: 2 / 1; transform: translate(-50%, -50%);
      background: radial-gradient(ellipse, rgba(236, 138, 60, .32), transparent 65%); filter: blur(10px); pointer-events: none; z-index: -1;
    }
    .drag-hint {
      position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%);
      font-size: .75rem; color: var(--muted); background: rgba(31, 19, 15, .6); border: 1px solid var(--line);
      padding: 4px 12px; border-radius: 999px; pointer-events: none; transition: opacity .6s; backdrop-filter: blur(4px);
    }
    .drag-hint.hide { opacity: 0; }
    .hero-kicker { color: var(--orange); font-size: .75rem; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; }
    .hero-title { font-family: 'Fraunces', Georgia, serif; font-style: italic; font-weight: 600; font-size: clamp(2rem, 7vw, 2.8rem); line-height: 1.1; margin: 4px 0 6px; }
    .hero-desc { color: var(--muted); font-size: .95rem; max-width: 420px; margin: 0 auto 18px; }
    .hero-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 12px 20px; border-radius: 999px; font-weight: 600; font-size: .95rem;
      transition: transform .15s ease, box-shadow .2s ease, background .2s;
    }
    .btn:active { transform: scale(.96); }
    .btn-primary { background: linear-gradient(180deg, var(--orange-2), var(--orange)); color: #2a1408; box-shadow: 0 6px 18px rgba(236, 138, 60, .35), inset 0 1px 0 rgba(255, 255, 255, .35); }
    .btn-primary:hover { box-shadow: 0 8px 26px rgba(236, 138, 60, .5), inset 0 1px 0 rgba(255, 255, 255, .35); }
    .btn-ghost { border: 1px solid var(--line-strong); color: var(--cream); background: rgba(255, 255, 255, .02); }
    .btn-ghost:hover { background: rgba(236, 138, 60, .08); }

    .pz-fallback { position: absolute; left: 50%; top: 50%; width: 200px; height: 200px; transform: translate(-50%, -50%) rotateX(55deg); border-radius: 50%;
      background:
        radial-gradient(circle at 35% 40%, #fff6e6 0 7%, transparent 8%),
        radial-gradient(circle at 62% 32%, #fff6e6 0 8%, transparent 9%),
        radial-gradient(circle at 58% 66%, #fff6e6 0 8%, transparent 9%),
        radial-gradient(circle at 40% 64%, #2f7a2e 0 4%, transparent 5%),
        radial-gradient(circle at 55% 48%, #2f7a2e 0 4%, transparent 5%),
        radial-gradient(circle, #c8321f 0 72%, #e6ac62 74% 88%, #b56d2a 100%);
      box-shadow: 0 30px 40px rgba(0,0,0,.5); animation: fb-spin 16s linear infinite; }
    .pizza-stage.is-fallback { perspective: 700px; }
    @keyframes fb-spin { to { transform: translate(-50%, -50%) rotateX(55deg) rotateZ(360deg); } }

    .cat-nav {
      position: sticky; top: 0; z-index: 50; margin: 28px -16px 8px; padding: 10px 16px;
      background: rgba(31, 19, 15, .82); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
      display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
    }
    .cat-nav::-webkit-scrollbar { display: none; }
    .cat-nav a {
      flex: 0 0 auto; text-decoration: none; color: var(--muted); font-size: .85rem; font-weight: 500;
      padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); transition: all .2s;
    }
    .cat-nav a.active { color: #2a1408; background: var(--orange); border-color: var(--orange); font-weight: 600; }

    .menu-section { padding-top: 22px; }
    .section-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px; }
    .section-head h2 { font-family: 'Fraunces', Georgia, serif; font-style: italic; font-weight: 600; font-size: 1.6rem; color: var(--cream); white-space: nowrap; }
    .section-head::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--line-strong), transparent); align-self: center; }
    .section-head .count { color: var(--orange); font-size: .8rem; font-weight: 600; }

    .card {
      position: relative; display: flex; align-items: center; gap: 14px;
      background: linear-gradient(160deg, var(--surface-2), var(--surface) 60%);
      border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 12px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, .18);
      transition: border-color .25s, transform .25s, box-shadow .25s;
    }
    @media (hover: hover) {
      .card:hover { border-color: var(--line-strong); transform: translateY(-2px); box-shadow: var(--shadow); }
      .card:hover .pz-photo > * { transform: rotate(35deg) scale(1.05); }
    }
    .card.in-cart { border-color: rgba(236, 138, 60, .6); }

    .pz-photo {
      position: relative; flex: 0 0 auto; width: 84px; height: 84px; border-radius: 50%; overflow: hidden; cursor: zoom-in;
      background: radial-gradient(circle at 35% 30%, #4a3024, #1a0f0b);
      box-shadow: 0 8px 18px rgba(0, 0, 0, .45), 0 0 0 3px rgba(236, 138, 60, .18);
    }
    .pz-photo > * { width: 100%; height: 100%; display: block; object-fit: cover; transition: transform .8s cubic-bezier(.2, .8, .2, 1); }
    .pz-photo svg { padding: 3px; }
    .pz-photo::after { content: ""; position: absolute; inset: 0; border-radius: 50%; pointer-events: none; background: linear-gradient(135deg, rgba(255,255,255,.22), transparent 42%); }

    .card-info { flex: 1; min-width: 0; }
    .card-title { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; margin-bottom: 3px; }
    .num { font-size: .7rem; font-weight: 700; color: var(--orange); background: rgba(236, 138, 60, .12); padding: 2px 7px; border-radius: 6px; letter-spacing: .04em; }
    .card h3 { font-size: 1.05rem; font-weight: 600; color: var(--cream); }
    .tag { font-size: .66rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; }
    .tag.firma { color: var(--orange-2); }
    .tag.hot { color: #ff8a6b; }
    .tag.free { color: #8fd18f; }
    .card p { font-size: .84rem; color: var(--muted); }

    .card-side { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; flex: 0 0 auto; }
    .price { font-weight: 700; font-size: 1.05rem; color: var(--cream); white-space: nowrap; }
    .price small { font-weight: 500; color: var(--orange); margin-right: 2px; }
    .add {
      display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px;
      background: linear-gradient(180deg, var(--orange-2), var(--orange)); color: #2a1408; font-weight: 600; font-size: .85rem;
      box-shadow: 0 4px 12px rgba(236, 138, 60, .3), inset 0 1px 0 rgba(255,255,255,.35);
      transition: transform .12s, box-shadow .2s;
    }
    .add:hover { box-shadow: 0 6px 18px rgba(236, 138, 60, .5), inset 0 1px 0 rgba(255,255,255,.35); }
    .add:active { transform: scale(.92); }
    .add .plus { font-size: 1.15rem; line-height: 1; font-weight: 700; }
    .qty-badge {
      position: absolute; top: -8px; left: 70px; min-width: 26px; height: 26px; padding: 0 7px; border-radius: 999px;
      background: var(--orange); color: #2a1408; font-size: .78rem; font-weight: 700; display: grid; place-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,.4); transform: scale(0); transition: transform .3s cubic-bezier(.3, 1.7, .5, 1);
    }
    .card.in-cart .qty-badge { transform: scale(1); }

    .cart-box {
      margin-top: 34px; padding: 22px 18px; border-radius: 24px;
      background: linear-gradient(170deg, var(--surface-2), var(--bg-2));
      border: 1px solid var(--line-strong); box-shadow: 0 24px 50px rgba(0, 0, 0, .45);
    }
    .cart-box > h2 { font-family: 'Fraunces', Georgia, serif; font-style: italic; font-weight: 600; font-size: 1.6rem; margin-bottom: 14px; }
    .cart-empty { color: var(--muted); font-size: .9rem; text-align: center; padding: 18px; border: 1px dashed var(--line-strong); border-radius: 14px; }
    .cart-list { list-style: none; }
    .cart-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .cart-row .name { flex: 1; min-width: 0; font-size: .92rem; }
    .cart-row .name small { display: block; color: var(--muted); font-size: .75rem; }
    .stepper { display: flex; align-items: center; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; }
    .stepper button { width: 32px; height: 32px; border-radius: 50%; font-size: 1.1rem; font-weight: 600; color: var(--orange); }
    .stepper span { min-width: 22px; text-align: center; font-weight: 600; font-size: .9rem; }
    .cart-row .line-tot { width: 70px; text-align: right; font-weight: 600; font-size: .92rem; }
    .cart-total { display: flex; justify-content: space-between; align-items: baseline; padding-top: 14px; font-size: 1.05rem; }
    .cart-total strong { font-size: 1.5rem; color: var(--orange-2); }

    .form-group { margin-top: 22px; }
    .form-label { display: block; font-size: .78rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--orange); margin-bottom: 10px; }
    .form-label .req { color: var(--danger); }

    .choice-list { display: grid; gap: 8px; }
    .choice { position: relative; display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; }
    .choice input { position: absolute; opacity: 0; pointer-events: none; }
    .choice .dot { flex: 0 0 auto; width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line-strong); display: grid; place-items: center; }
    .choice .dot::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--orange); transform: scale(0); transition: transform .2s; }
    .choice:has(input:checked) { border-color: var(--orange); background: rgba(236, 138, 60, .08); }
    .choice:has(input:checked) .dot { border-color: var(--orange); }
    .choice:has(input:checked) .dot::after { transform: scale(1); }
    .choice-title { font-weight: 600; font-size: .93rem; }
    .choice-desc { font-size: .8rem; color: var(--muted); }

    .service { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .service .choice { flex-direction: column; align-items: flex-start; gap: 4px; padding: 14px; }
    .service .ico { font-size: 1.6rem; line-height: 1; margin-bottom: 4px; }
    .service .choice .dot { position: absolute; top: 12px; right: 12px; }
    .time-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    .time-chip { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); font-weight: 600; font-size: .88rem; }
    .time-chip.on { background: var(--orange); color: #2a1408; border-color: var(--orange); }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    #groupIndirizzo { overflow: hidden; transition: max-height .4s ease, opacity .3s; max-height: 0; opacity: 0; }
    #groupIndirizzo.open { max-height: 200px; opacity: 1; }

    #groupStripePayment { overflow: hidden; max-height: 0; opacity: 0; transition: max-height .4s ease, opacity .3s ease; background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 0 16px; margin-top: 0; }
    #groupStripePayment.open { max-height: 300px; opacity: 1; padding: 16px; margin-top: 22px; border-color: var(--orange); }
    #card-element { padding: 12px; background: var(--surface); border-radius: 8px; border: 1px solid var(--line-strong); }
    #card-errors { color: var(--danger); font-size: 0.85rem; margin-top: 8px; }

    .field.invalid { border-color: var(--danger); box-shadow: 0 0 0 3px rgba(255, 123, 107, .2); }
    .field { width: 100%; padding: 13px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--bg); color: var(--cream); font: inherit; font-size: 1rem; }
    .field:focus { outline: none; border-color: var(--orange); }

    .btn-invia {
      width: 100%; margin-top: 24px; padding: 17px; border-radius: 16px; font-size: 1.05rem; font-weight: 700;
      background: linear-gradient(180deg, var(--orange-2), var(--orange)); color: #2a1408; cursor: pointer;
    }
    .pay-note { text-align: center; color: var(--muted); font-size: .8rem; margin-top: 12px; }
    footer { text-align: center; color: #7f6a5d; font-size: .78rem; padding: 34px 0 10px; }

    #cart-bar {
      position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom)); z-index: 60;
      width: min(728px, calc(100% - 24px)); transform: translate(-50%, 140%);
      display: flex; align-items: center; gap: 12px; padding: 10px 18px; border-radius: 999px;
      background: rgba(47, 30, 23, .92); border: 1px solid var(--line-strong); transition: transform .45s;
    }
    #cart-bar.show { transform: translate(-50%, 0); }
    #cart-bar .cb-count { background: var(--orange); color: #2a1408; font-weight: 700; min-width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; }
    #cart-bar .cb-text { flex: 1; }

    #pz-lightbox { position: fixed; inset: 0; z-index: 100; display: none; align-items: center; justify-content: center; padding: 20px; background: rgba(15, 8, 5, .8); }
    #pz-lightbox.open { display: flex; }
    .lb-card { width: min(400px, 100%); text-align: center; padding: 26px 22px 22px; border-radius: 26px; background: var(--surface-2); border: 1px solid var(--line-strong); }
    .lb-pic { width: min(240px, 66vw); aspect-ratio: 1; margin: 0 auto 18px; border-radius: 50%; overflow: hidden; }
    .lb-pic > * { width: 100%; height: 100%; display: block; object-fit: cover; }
    .lb-actions { display: flex; gap: 10px; margin-top: 15px; }
    .lb-actions .btn { flex: 1; }

    #toast { position: fixed; left: 50%; top: 18px; z-index: 200; transform: translate(-50%, -160%); padding: 12px 18px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line-strong); transition: transform .4s; }
    #toast.show { transform: translate(-50%, 0); }
    #toast.ok { border-color: var(--basil); }
    #toast.err { border-color: var(--danger); }
    .fx-plus { position: fixed; z-index: 150; pointer-events: none; font-weight: 700; color: var(--orange-2); animation: fx-plus .9s ease-out forwards; }
    @keyframes fx-plus { 0% { opacity: 0; transform: translate(-50%, 0) scale(.6); } 100% { opacity: 0; transform: translate(-50%, -60px) scale(1.2); } }
  </style>
</head>
<body>

  <div class="wrap">
    <header>
      <div class="logo">
        <div class="logo-top">PIZZERIA</div>
        <div class="logo-main">
          <svg class="logo-tri" viewBox="0 0 100 92"><polygon points="5,5 95,5 50,86" fill="none" stroke="#ec8a3c" stroke-width="7"/></svg>
          <span class="logo-word">ALCHIMIA</span>
          <span class="logo-ver">3.0</span>
        </div>
        <div class="logo-sub">Elementi in evoluzione</div>
      </div>
      <p class="header-note">Ordina per <b>asporto</b> o <b>consegna a domicilio</b></p>
    </header>

    <section class="hero" style="text-align:center; margin:15px 0;">
      <h1 class="hero-title" style="font-family:'Fraunces',serif; font-style:italic;">I Nostri Sapori</h1>
      <p class="hero-desc">Scegli le tue pizze preferite dal menu sottostante.</p>
    </section>

    <nav class="cat-nav" id="catNav"></nav>
    <main id="menu"></main>

    <section class="cart-box" id="cartBox">
      <h2>Il tuo ordine</h2>
      <div id="cartSummary"></div>

      <div class="form-group">
        <span class="form-label">Ritiro o consegna <span class="req">*</span></span>
        <div class="service">
          <label class="choice">
            <input type="radio" name="tipoServizio" value="Asporto" checked>
            <span class="dot"></span>
            <span class="ico">📦</span>
            <span class="choice-title">Asporto</span>
            <span class="choice-desc">Ritiri tu in pizzeria</span>
          </label>
          <label class="choice">
            <input type="radio" name="tipoServizio" value="Domicilio">
            <span class="dot"></span>
            <span class="ico">🛵</span>
            <span class="choice-title">Domicilio</span>
            <span class="choice-desc">Te la portiamo a casa</span>
          </label>
        </div>
      </div>

      <div class="form-group">
        <span class="form-label">Tipo di impasto</span>
        <div class="choice-list">
          <label class="choice">
            <input type="radio" name="tipoImpasto" value="Impasto Alchimia (Speciale)" checked>
            <span class="dot"></span>
            <span><span class="choice-title">Impasto Alchimia</span><br><span class="choice-desc">Farina 1 e grano antico</span></span>
          </label>
          <label class="choice">
            <input type="radio" name="tipoImpasto" value="Impasto Classico">
            <span class="dot"></span>
            <span><span class="choice-title">Impasto Classico</span><br><span class="choice-desc">Lievitazione naturale</span></span>
          </label>
          <label class="choice">
            <input type="radio" name="tipoImpasto" value="Impasto Integrale">
            <span class="dot"></span>
            <span><span class="choice-title">Impasto Integrale</span><br><span class="choice-desc">Ricco di fibre</span></span>
          </label>
        </div>
      </div>

      <div class="two-col">
        <div class="form-group">
          <label class="form-label" for="custName">Nome <span class="req">*</span></label>
          <input class="field" type="text" id="custName" placeholder="Mario Rossi">
        </div>
        <div class="form-group">
          <label class="form-label" for="custPhone">Telefono <span class="req">*</span></label>
          <input class="field" type="tel" id="custPhone" placeholder="3331234567">
        </div>
      </div>

      <div id="groupIndirizzo">
        <div class="form-group">
          <label class="form-label" for="custAddress">Indirizzo <span class="req">*</span></label>
          <input class="field" type="text" id="custAddress" placeholder="Via Roma 1">
        </div>
      </div>

      <div id="groupStripePayment">
        <div class="form-group" style="margin-top:0;">
          <label class="form-label">Pagamento carta <span class="req">*</span></label>
          <div id="card-element"></div>
          <div id="card-errors" role="alert"></div>
        </div>
      </div>

      <div class="form-group" id="timeGroup">
        <label class="form-label" for="custTime"><span id="timeLabel">Orario di ritiro</span> <span class="req">*</span></label>
        <div class="time-chips" id="timeChips"></div>
        <input class="field" type="time" id="custTime" step="300">
      </div>

      <div class="form-group">
        <label class="form-label" for="custNotes">Note</label>
        <textarea class="field" id="custNotes" rows="2" placeholder="Richieste speciali..."></textarea>
      </div>

      <button type="button" class="btn-invia" id="btnInviaOrdine">INVIA ORDINE IN CUCINA</button>
      <p class="pay-note" id="payNote">Paghi al ritiro.</p>
    </section>

    <footer>Pizzeria Alchimia 3.0</footer>
  </div>

  <div id="cart-bar">
    <span class="cb-count" id="cbCount">0</span>
    <span class="cb-text" id="cbText"></span>
    <button class="btn btn-primary" type="button" id="cbGo">Vedi ordine</button>
  </div>
  <div id="toast"></div>

  <script>
    const MENU = [
      { id: 'classiche', titolo: 'Le Classiche', pizze: [
        ['01', 'Margherita', 'Pomodoro, mozzarella, basilico', 5.00],
        ['02', 'Margheritella', 'Pomodoro, basilico, parmigiano', 5.50],
        ['03', 'Margherita senza lattosio', 'Pomodoro, mozzarella senza lattosio', 5.50, 'free'],
        ['04', 'Napoli', 'Pomodoro, mozzarella, acciughe, capperi', 6.00],
        ['05', 'Diavola', 'Pomodoro, mozzarella, salamino piccante', 6.50, 'hot'],
        ['06', 'Nuova 4 Stagioni', 'Base pomodoro e mozzarella, divisa in 4 spicchi', 7.50],
        ['07', 'Tonno e Cipolla', 'Pomodoro, mozzarella, tonno, cipolla', 7.50],
        ['08', 'Wurstel e Patatine', 'Mozzarella, wurstel, patatine fritte', 7.00],
        ['09', 'Capricciosa', 'Pomodoro, mozzarella, prosciutto cotto, funghi', 7.00],
        ['10', 'Calzone', 'Pomodoro, mozzarella, prosciutto cotto, funghi', 7.00],
        ['11', 'Porcini e Salsiccia', 'Pomodoro, mozzarella, funghi porcini, salsiccia', 8.50],
        ['12', 'Ortolana', 'Pomodoro, mozzarella, melanzane, zucchine, peperoni', 7.00],
        ['13', 'Completa', 'Pomodoro, mozzarella, cotto, capperi, funghi, carciofi', 7.50],
        ['14', 'Principessa', 'Pomodoro, mozzarella, panna e crudo', 8.00]
      ]},
      { id: 'speciali', titolo: 'Le Speciali', pizze: [
        ['15', 'Martinese', 'Pomodoro, mozzarella, capocollo di Martina Franca, stracciatella', 8.00],
        ['16', 'Alchimia', 'Mozzarella, mortadella, pesto di pistacchio, burrata', 10.00, 'firma']
      ]},
      { id: 'bianche', titolo: 'Le Bianche & Sfiziose', pizze: [
        ['17', 'Bufalina', 'Mozzarella, bufala fresca', 8.00],
        ['18', '4 Formaggi', 'Mozzarella, gorgonzola, emmental, fontina', 8.00],
        ['19', 'Fumè', 'Speck e scamorza', 8.00],
        ['20', 'Bresaola e Rucola', 'Bresaola, rucola, grana', 8.50],
        ['21', 'Furore', 'Mozzarella, tonno, scamorza', 8.00],
        ['22', 'Fresca', 'Mozzarella, pomodorini, grana, funghi', 7.50]
      ]}
    ];
    const TAG_LABEL = { firma: '★ Firma', hot: '🌶 Piccante', free: 'Senza lattosio' };
    const euro = n => n.toFixed(2).replace('.', ',');
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    (function buildMenu() {
      const main = document.getElementById('menu'), nav = document.getElementById('catNav');
      MENU.forEach(sec => {
        nav.insertAdjacentHTML('beforeend', `<a href="#${sec.id}" data-sec="${sec.id}">${esc(sec.titolo)}</a>`);
        let html = `<section class="menu-section" id="${sec.id}"><div class="section-head"><h2>${esc(sec.titolo)}</h2><span class="count">${sec.pizze.length}</span></div>`;
        sec.pizze.forEach(([num, nome, desc, prezzo, tag]) => {
          const full = `${num} - ${nome}`;
          html += `<article class="card" data-name="${esc(full)}" data-price="${prezzo}">
            <div class="pz-photo" role="button"></div>
            <span class="qty-badge"></span>
            <div class="card-info">
              <div class="card-title"><span class="num">${num}</span><h3>${esc(nome)}</h3>${tag ? `<span class="tag ${tag}">${TAG_LABEL[tag]}</span>` : ''}</div>
              <p>${esc(desc)}</p>
            </div>
            <div class="card-side">
              <div class="price"><small>€</small>${euro(prezzo)}</div>
              <button class="add" type="button"><span class="plus">+</span><span class="lbl">Aggiungi</span></button>
            </div>
          </article>`;
        });
        main.insertAdjacentHTML('beforeend', html + '</section>');
      });
      main.addEventListener('click', e => {
        const b = e.target.closest('.add');
        if (!b) return;
        const card = b.closest('.card');
        aggiungiAlCarrello(card.dataset.name, parseFloat(card.dataset.price), b);
      });
    })();

    const stripe = Stripe('pk_test_12345');
    let elements, cardElement;

    function initStripeElements() {
      if (!cardElement) {
        elements = stripe.elements();
        cardElement = elements.create('card');
        cardElement.mount('#card-element');
      }
    }

    function gestisciCampoIndirizzo() {
      const domicilio = document.querySelector('input[name="tipoServizio"]:checked').value === 'Domicilio';
      const box = document.getElementById('groupIndirizzo');
      const stripeBox = document.getElementById('groupStripePayment');
      box.classList.toggle('open', domicilio);
      stripeBox.classList.toggle('open', domicilio);
      document.getElementById('timeLabel').textContent = domicilio ? 'Orario di consegna' : 'Orario di ritiro';
      document.getElementById('payNote').textContent = domicilio ? 'Pagamento anticipato con carta.' : 'Paghi al ritiro.';
      if (domicilio) initStripeElements();
      preparaOrari();
    }
    document.querySelectorAll('input[name="tipoServizio"]').forEach(r => r.addEventListener('change', gestisciCampoIndirizzo));

    function preparaOrari() {
      const domicilio = document.querySelector('input[name="tipoServizio"]:checked').value === 'Domicilio';
      const d = new Date(Date.now() + (domicilio ? 45 : 30) * 60000);
      d.setMinutes(Math.ceil(d.getMinutes() / 15) * 15, 0, 0);
      const wrap = document.getElementById('timeChips'), input = document.getElementById('custTime');
      wrap.innerHTML = '';
      for (let i = 0; i < 4; i++) {
        const t = new Date(d.getTime() + i * 15 * 60000);
        const v = String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0');
        wrap.insertAdjacentHTML('beforeend', `<button type="button" class="time-chip${input.value === v ? ' on' : ''}" data-t="${v}">${v}</button>`);
      }
    }
    document.getElementById('timeChips').addEventListener('click', e => {
      const b = e.target.closest('.time-chip');
      if (!b) return;
      document.getElementById('custTime').value = b.dataset.t;
      document.querySelectorAll('.time-chip').forEach(c => c.classList.toggle('on', c === b));
    });
    preparaOrari();

    // ==========================================
    // CONNESSIONE SOCKET.IO ASSOLUTA E FORZATA
    // ==========================================
    const SOCKET_URL = window.location.origin.includes('onrender.com') 
      ? window.location.origin 
      : 'https://alchimia-pizzeria.onrender.com';

    let socket = null;
    try {
      if (typeof io === 'function') {
        socket = io(SOCKET_URL, { transports: ['websocket', 'polling'] });
        socket.on('connect', () => console.log('✅ Connesso a Socket.io, ID:', socket.id));
        socket.on('connect_error', (err) => console.error('❌ Errore Socket.io:', err));
      }
    } catch (e) { socket = null; }

    let carrelloCorrente = [];

    function aggiungiAlCarrello(nome, prezzo, fromEl) {
      carrelloCorrente.push({ name: nome, price: prezzo, selectedExtras: [] });
      aggiornaVistaCarrello();
    }
    function rimuoviUno(nome) {
      for (let i = carrelloCorrente.length - 1; i >= 0; i--) {
        if (carrelloCorrente[i].name === nome) { carrelloCorrente.splice(i, 1); break; }
      }
      aggiornaVistaCarrello();
    }

    function aggiornaVistaCarrello() {
      const summary = document.getElementById('cartSummary');
      const gruppi = new Map();
      let totale = 0;
      carrelloCorrente.forEach(it => {
        totale += it.price;
        const g = gruppi.get(it.name) || { name: it.name, price: it.price, qty: 0 };
        g.qty++; gruppi.set(it.name, g);
      });

      if (!carrelloCorrente.length) {
        summary.innerHTML = '<div class="cart-empty">Nessuna pizza selezionata.</div>';
      } else {
        let html = '<ul class="cart-list">';
        gruppi.forEach(g => {
          html += `<li class="cart-row"><div class="name">${esc(g.name)}</div><div class="stepper"><button type="button" data-act="minus" data-name="${esc(g.name)}">−</button><span>${g.qty}</span><button type="button" data-act="plus" data-name="${esc(g.name)}" data-price="${g.price}">+</button></div><div class="line-tot">€ ${euro(g.price * g.qty)}</div></li>`;
        });
        summary.innerHTML = html + `</ul><div class="cart-total"><span>Totale</span><strong>€ ${euro(totale)}</strong></div>`;
      }
      document.querySelectorAll('.card').forEach(c => {
        const g = gruppi.get(c.dataset.name);
        c.classList.toggle('in-cart', !!g);
        c.querySelector('.qty-badge').textContent = g ? '×' + g.qty : '';
      });
      const bar = document.getElementById('cart-bar'), n = carrelloCorrente.length;
      document.getElementById('cbCount').textContent = n;
      document.getElementById('cbText').innerHTML = `${n} pizze · <b>€ ${euro(totale)}</b>`;
      bar.classList.toggle('show', n > 0);
    }

    document.getElementById('cartSummary').addEventListener('click', e => {
      const b = e.target.closest('button[data-act]');
      if (!b) return;
      if (b.dataset.act === 'minus') rimuoviUno(b.dataset.name);
      else { carrelloCorrente.push({ name: b.dataset.name, price: parseFloat(b.dataset.price) }); aggiornaVistaCarrello(); }
    });

    function toast(msg, tipo) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.className = 'show ' + (tipo || '');
      setTimeout(() => t.className = '', 3200);
    }

    document.getElementById('btnInviaOrdine').addEventListener('click', () => {
      if (!carrelloCorrente.length) { alert('Il carrello è vuoto!'); return; }
      const servizio = document.querySelector('input[name="tipoServizio"]:checked').value;
      const name = document.getElementById('custName').value.trim();
      const phone = document.getElementById('custPhone').value.trim();
      const time = document.getElementById('custTime').value;

      if (!name || !phone || !time) { alert('Compila nome, telefono e orario!'); return; }
      if (servizio === 'Domicilio' && !document.getElementById('custAddress').value.trim()) { alert('Inserisci l\'indirizzo!'); return; }
      if (!socket) { alert('Connessione con la cucina non attiva.'); return; }

      const impasto = document.querySelector('input[name="tipoImpasto"]:checked').value;
      const notes = document.getElementById('custNotes').value.trim();

      const orderData = {
        id: 'ORD-' + Math.floor(1000 + Math.random() * 9000),
        table: `${servizio.toUpperCase()} - ${name}`,
        time: time,
        items: carrelloCorrente,
        customer: {
          name: name,
          phone: phone,
          time: time,
          address: servizio === 'Domicilio' ? document.getElementById('custAddress').value : 'Ritiro in Pizzeria'
        },
        notes: `Impasto: ${impasto}${notes ? ' - Note: ' + notes : ''}`,
        statoPagamento: servizio === 'Domicilio' ? '💳 PAGATO CON CARTA' : '🔴 DA PAGARE',
        stato: 'In attesa di conferma'
      };

      socket.emit('nuovo_ordine', orderData);
      toast('✅ Ordine inviato con successo in cucina!', 'ok');
      carrelloCorrente = [];
      aggiornaVistaCarrello();
    });
  </script>
</body>
</html>
