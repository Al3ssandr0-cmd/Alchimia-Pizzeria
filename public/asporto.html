<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1f130f">
  <title>Pizzeria Alchimia - Asporto & Domicilio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Fraunces:ital,opsz,wght@1,9..144,500;1,9..144,600&display=swap" rel="stylesheet">
  <script src="https://js.stripe.com/v3/"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    :root {
      --bg: #1f130f; --bg-2: #2a1a14; --surface: #2f1e17; --surface-2: #3a261d;
      --line: rgba(236, 138, 60, .16); --line-strong: rgba(236, 138, 60, .45);
      --orange: #ec8a3c; --orange-2: #f7a659; --orange-dark: #b8601f;
      --cream: #f4ebdf; --muted: #bfa797; --basil: #4caf50; --danger: #ff7b6b;
      --radius: 18px; --shadow: 0 10px 30px rgba(0, 0, 0, .35);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--cream); min-height: 100vh; padding-bottom: 96px; }
    .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }
    header { text-align: center; padding: 34px 0 6px; }
    .logo { display: inline-flex; flex-direction: column; align-items: center; }
    .logo-top { color: var(--orange); font-weight: 800; font-size: 1.5rem; }
    .logo-word { font-weight: 700; font-size: 3rem; color: var(--cream); }
    .cart-box { margin-top: 34px; padding: 22px 18px; border-radius: 24px; background: var(--surface-2); border: 1px solid var(--line-strong); }
    .form-group { margin-top: 22px; }
    .form-label { display: block; font-size: .78rem; font-weight: 600; color: var(--orange); margin-bottom: 10px; text-transform: uppercase; }
    .field { width: 100%; padding: 13px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--bg); color: var(--cream); font: inherit; }
    .btn-invia { width: 100%; margin-top: 24px; padding: 17px; border-radius: 16px; font-size: 1.05rem; font-weight: 700; background: var(--orange); color: #2a1408; cursor: pointer; }
    #groupIndirizzo, #groupStripePayment { max-height: 0; opacity: 0; overflow: hidden; transition: 0.3s; }
    #groupIndirizzo.open, #groupStripePayment.open { max-height: 300px; opacity: 1; margin-top: 22px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo">
        <div class="logo-top">PIZZERIA</div>
        <div class="logo-word">ALCHIMIA</div>
      </div>
      <p>Ordina per asporto o domicilio</p>
    </header>

    <section class="cart-box">
      <h2>Il tuo ordine</h2>
      <div id="cartSummary">Carrello vuoto</div>

      <div class="form-group">
        <span class="form-label">Servizio</span>
        <div style="display:flex; gap:10px;">
          <label><input type="radio" name="tipoServizio" value="Asporto" checked> Asporto</label>
          <label><input type="radio" name="tipoServizio" value="Domicilio"> Domicilio</label>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="custName">Nome</label>
        <input class="field" type="text" id="custName" placeholder="Mario Rossi">
      </div>

      <div class="form-group">
        <label class="form-label" for="custPhone">Telefono</label>
        <input class="field" type="tel" id="custPhone" placeholder="3331234567">
      </div>

      <div id="groupIndirizzo">
        <div class="form-group">
          <label class="form-label" for="custAddress">Indirizzo</label>
          <input class="field" type="text" id="custAddress" placeholder="Via Roma 1">
        </div>
      </div>

      <div id="groupStripePayment">
        <div class="form-group">
          <label class="form-label">Pagamento Carta</label>
          <div id="card-element" style="padding:10px; background:var(--bg); border-radius:8px;"></div>
        </div>
      </div>

      <button type="button" class="btn-invia" id="btnInviaOrdine">INVIA ORDINE</button>
    </section>
  </div>

  <script>
    // CONNESSIONE SOCKET.IO FORZATA E ASSOLUTA
    const SOCKET_URL = window.location.origin.includes('onrender.com') ? window.location.origin : 'https://alchimia-pizzeria.onrender.com';
    let socket = null;
    try {
      if (typeof io === 'function') {
        socket = io(SOCKET_URL, { transports: ['websocket', 'polling'] });
      }
    } catch (e) { socket = null; }

    document.querySelectorAll('input[name="tipoServizio"]').forEach(r => r.addEventListener('change', (e) => {
      const isDom = e.target.value === 'Domicilio';
      document.getElementById('groupIndirizzo').classList.toggle('open', isDom);
      document.getElementById('groupStripePayment').classList.toggle('open', isDom);
    }));

    document.getElementById('btnInviaOrdine').addEventListener('click', () => {
      const servizio = document.querySelector('input[name="tipoServizio"]:checked').value;
      const name = document.getElementById('custName').value.trim();
      const phone = document.getElementById('custPhone').value.trim();
      
      if (!name || !phone) { alert('Compila nome e telefono!'); return; }
      if (!socket) { alert('Connessione cucina non attiva.'); return; }

      const orderData = {
        id: 'ORD-' + Math.floor(1000 + Math.random() * 9000),
        table: `${servizio.toUpperCase()} - ${name}`,
        time: 'Subito',
        items: [{ name: '01 - Margherita', price: 5.00, qty: 1 }],
        customer: { name, phone, address: servizio === 'Domicilio' ? document.getElementById('custAddress').value : 'Ritiro' },
        notes: '',
        statoPagamento: servizio === 'Domicilio' ? '💳 PAGATO' : '🔴 DA PAGARE',
        stato: 'In attesa di conferma'
      };

      socket.emit('nuovo_ordine', orderData);
      alert('Ordine inviato con successo!');
    });
  </script>
</body>
</html>
