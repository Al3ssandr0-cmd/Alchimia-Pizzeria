<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pizzeria Alchimia - Display Cucina</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #f59e0b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text); padding: 20px; }
    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 2px solid #334155; margin-bottom: 25px; }
    h1 { color: var(--accent); font-size: 1.8rem; }
    .status-badge { background: #334155; padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; color: var(--success); font-weight: bold; }
    
    .grid-orders { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
    .order-card { background: var(--card-bg); border-radius: 12px; border: 1px solid #334155; padding: 18px; position: relative; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
    .order-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
    .order-type { font-weight: bold; font-size: 1.1rem; color: var(--accent); }
    .order-time { font-size: 0.85rem; color: var(--text-muted); }
    
    .customer-info { margin-bottom: 12px; font-size: 0.9rem; line-height: 1.4; color: #cbd5e1; }
    .customer-info strong { color: var(--text); }

    .items-list { margin: 12px 0; padding-left: 0; list-style: none; border-top: 1px dashed #334155; padding-top: 10px; }
    .items-list li { margin-bottom: 8px; font-size: 1rem; }
    .extras { display: block; font-size: 0.85rem; color: var(--accent); margin-left: 10px; }

    .order-notes { background: #0f172a; border-left: 3px solid var(--accent); padding: 8px 10px; border-radius: 4px; font-size: 0.85rem; margin-bottom: 15px; color: #f1f5f9; }
    
    .payment-tag { display: inline-block; padding: 4px 8px; border-radius: 6px; font-weight: bold; font-size: 0.8rem; margin-bottom: 15px; }
    .pay-cassa { background: #f59e0b22; color: #f59e0b; border: 1px solid #f59e0b; }
    .pay-online { background: #10b98122; color: #10b981; border: 1px solid #10b981; }

    .btn-status { width: 100%; background: var(--accent); color: #000; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.95rem; }
    .btn-status:hover { opacity: 0.9; }
    .empty-msg { text-align: center; color: var(--text-muted); grid-column: 1 / -1; margin-top: 50px; font-size: 1.2rem; }
  </style>
</head>
<body>

  <header>
    <h1>👨‍🍳 Display Cucina - Pizzeria Alchimia</h1>
    <div class="status-badge">🟢 Connesso al Server</div>
  </header>

  <div id="ordersContainer" class="grid-orders">
    <div id="emptyMsg" class="empty-msg">In attesa di nuovi ordini...</div>
  </div>

  <script>
    const socket = io();
    const ordiniRicevuti = new Set();

    // 1. Riceve lo storico degli ordini esistenti appena si connette
    socket.on('carica_ordini_esistenti', (ordini) => {
      console.log("Ordini esistenti ricevuti:", ordini);
      ordini.forEach(ordine => mostraOrdineInCucina(ordine));
    });

    // 2. Riceve in tempo reale ogni nuovo ordine inviato
    socket.on('nuovo_ordine', (orderData) => {
      console.log("Nuovo ordine in tempo reale:", orderData);
      mostraOrdineInCucina(orderData);
    });

    function mostraOrdineInCucina(ordine) {
      // Evita duplicati se l'ordine è già presente sullo schermo
      if (ordiniRicevuti.has(ordine.id)) return;
      ordiniRicevuti.add(ordine.id);

      const emptyMsg = document.getElementById('emptyMsg');
      if (emptyMsg) emptyMsg.style.display = 'none';

      const container = document.getElementById('ordersContainer');
      const isOnline = ordine.statoPagamento && ordine.statoPagamento.includes('GIÀ PAGATO');

      let itemsHtml = '';
      ordine.items.forEach(item => {
        let extrasHtml = '';
        if (item.selectedExtras && item.selectedExtras.length > 0) {
          extrasHtml = `<span class="extras">+ ${item.selectedExtras.join(', ')}</span>`;
        }
        itemsHtml += `<li><strong>1x</strong> ${item.name} ${extrasHtml}</li>`;
      });

      const card = document.createElement('div');
      card.className = 'order-card';
      card.id = `card_${ordine.id}`;
      card.innerHTML = `
        <div class="order-header">
          <div class="order-type">${ordine.table}</div>
          <div class="order-time">Ore ${ordine.time || ''}</div>
        </div>
        
        <div class="customer-info">
          <div><strong>Cliente:</strong> ${ordine.customer.name}</div>
          <div><strong>Tel:</strong> ${ordine.customer.phone}</div>
          <div><strong>Orario rich:</strong> <span style="color: var(--accent); font-weight: bold;">${ordine.customer.time}</span></div>
          ${ordine.customer.address ? `<div><strong>Indirizzo:</strong> ${ordine.customer.address}</div>` : ''}
        </div>

        <div class="payment-tag ${isOnline ? 'pay-online' : 'pay-cassa'}">
          ${ordine.statoPagamento || 'DA VERIFICARE'}
        </div>

        <ul class="items-list">
          ${itemsHtml}
        </ul>

        ${ordine.notes ? `<div class="order-notes"><strong>Note:</strong> ${ordine.notes}</div>` : ''}

        <button class="btn-status" onclick="cambiaStato('${ordine.id}', 'In Preparazione')">
          IN PREPARAZIONE ⏳
        </button>
      `;

      container.prepend(card); // Mostra i nuovi ordini in alto
    }

    function cambiaStato(orderId, nuovoStato) {
      socket.emit('aggiorna_stato', { orderId: orderId, status: nuovoStato });
      const card = document.getElementById(`card_${orderId}`);
      if (card) {
        card.style.borderColor = 'var(--success)';
        const btn = card.querySelector('.btn-status');
        if (btn) {
          btn.innerText = 'PRONTO / IN CONSEGNA ✅';
          btn.style.background = 'var(--success)';
          btn.style.color = '#fff';
        }
      }
    }
  </script>
</body>
</html>
