<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pizzeria Alchimia - Schermo Cucina</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #f59e0b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --danger: #ef4444;
      --asporto: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text); padding: 20px; }
    header { background: #020617; padding: 15px 20px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--accent); margin-bottom: 20px; }
    header h1 { color: var(--accent); font-size: 1.5rem; }
    .orders-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
    .order-card { background: var(--card-bg); border-radius: 12px; border: 1px solid #334155; border-left: 6px solid var(--accent); padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); display: flex; flex-direction: column; justify-content: space-between; }
    
    /* Se è asporto/domicilio cambiamo il bordo sinistro in azzurro */
    .order-card.is-delivery { border-left-color: var(--asporto); }

    .order-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
    .order-table { font-weight: bold; color: var(--accent); font-size: 1.1rem; }
    .order-card.is-delivery .order-table { color: var(--asporto); }
    .order-time { color: var(--text-muted); font-size: 0.85rem; }
    
    /* Box Dati Cliente Asporto */
    .customer-box { background: #0b1329; border: 1px solid #334155; padding: 10px; border-radius: 8px; margin-bottom: 12px; font-size: 0.9rem; }
    .customer-box a { color: var(--asporto); text-decoration: none; font-weight: bold; }

    .order-items { margin-bottom: 15px; }
    .item-row { margin-bottom: 8px; font-size: 1rem; }
    .item-extras { font-size: 0.85rem; color: #cbd5e1; margin-left: 15px; margin-top: 2px; }
    
    .order-notes { background: #451a03; border: 1px solid #f59e0b; color: #fde68a; padding: 10px; border-radius: 8px; font-size: 0.9rem; margin-bottom: 15px; }

    .order-total { font-weight: bold; color: var(--success); font-size: 1.1rem; margin-bottom: 15px; text-align: right; }
    .actions { display: flex; gap: 10px; }
    .btn-prep { background: var(--accent); color: #000; border: none; padding: 10px; border-radius: 8px; font-weight: bold; flex: 1; cursor: pointer; }
    .btn-ready { background: var(--success); color: #fff; border: none; padding: 10px; border-radius: 8px; font-weight: bold; flex: 1; cursor: pointer; }
    .btn-prep:hover, .btn-ready:hover { opacity: 0.9; }
    .empty-message { text-align: center; color: var(--text-muted); grid-column: 1 / -1; margin-top: 50px; font-size: 1.2rem; }
  </style>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>

  <header>
    <h1>🍳 CUCINA / DISPLAY ORDINI</h1>
    <div id="connectionStatus" style="color: var(--success); font-weight: bold;">● Connesso</div>
  </header>

  <div class="orders-grid" id="ordersGrid">
    <div class="empty-message" id="emptyMessage">In attesa di nuovi ordini...</div>
  </div>

  <script>
    const socket = io();

    socket.on('nuovo_ordine_cucina', (order) => {
      const grid = document.getElementById('ordersGrid');
      const emptyMsg = document.getElementById('emptyMessage');
      if (emptyMsg) emptyMsg.remove();

      let itemsHtml = order.items.map(i => {
        let extrasHtml = i.selectedExtras.length > 0 ? `<div class="item-extras">➕ Extra: ${i.selectedExtras.join(', ')}</div>` : '';
        return `<div class="item-row">• <strong>${i.name}</strong> (${i.price.toFixed(2)} €)${extrasHtml}</div>`;
      }).join('');

      let notesHtml = order.notes && order.notes.trim() !== '' 
        ? `<div class="order-notes"><strong>⚠️ NOTE:</strong><br>${order.notes}</div>` 
        : '';

      // Controlliamo se è un ordine d'asporto/domicilio con dati cliente
      let customerHtml = '';
      let isDeliveryClass = '';
      if (order.customer) {
        isDeliveryClass = 'is-delivery';
        customerHtml = `
          <div class="customer-box">
            👤 <strong>${order.customer.name}</strong><br>
            📞 <a href="tel:${order.customer.phone}">${order.customer.phone}</a><br>
            ${order.customer.address ? `📍 ${order.customer.address}<br>` : ''}
            ⏰ <strong>Orario richiesto: ${order.customer.time}</strong>
          </div>
        `;
      }

      const card = document.createElement('div');
      card.className = `order-card ${isDeliveryClass}`;
      card.id = order.id;
      card.innerHTML = `
        <div>
          <div class="order-header">
            <span class="order-table">${order.table}</span>
            <span class="order-time">🕒 Inviato: ${order.time}</span>
          </div>
          ${customerHtml}
          <div class="order-items">
            ${itemsHtml}
          </div>
          ${notesHtml}
          <div class="order-total">Totale: ${order.total}</div>
        </div>
        <div class="actions">
          <button class="btn-prep" onclick="updateStatus('${order.id}', 'In preparazione')">In Preparazione</button>
          <button class="btn-ready" onclick="updateStatus('${order.id}', 'Pronto 🍕')">Pronto 🚀</button>
        </div>
      `;

      grid.prepend(card);
    });

    function updateStatus(orderId, status) {
      socket.emit('aggiorna_stato', { id: orderId, status: status });
      const card = document.getElementById(orderId);
      if (card) {
        card.style.borderLeftColor = 'var(--success)';
      }
    }
  </script>
</body>
</html>
